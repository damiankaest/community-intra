name: community-intranet-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:-community-intranet-backend:local}
    build:
      context: ..
      dockerfile: backend/CommunityIntranet.Api/Dockerfile
      args:
        CSDA_VERSION: ${CSDA_VERSION:-1.10.5}
        CSDA_SHA256: ${CSDA_SHA256:-5c972e016b90e08ae235e2ca8092423a1900868006a6cf0ceecd0f36f1be9cbe}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      AllowedHosts: ${APP_DOMAIN}
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: https://${APP_DOMAIN}
      Database__ApplyMigrations: "true"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Identity__PublicAppUrl: https://${APP_DOMAIN}
      ExternalLogin__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      ExternalLogin__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      ExternalLogin__Discord__ClientId: ${DISCORD_CLIENT_ID:-}
      ExternalLogin__Discord__ClientSecret: ${DISCORD_CLIENT_SECRET:-}
      ExternalLogin__SteamApiKey: ${STEAM_API_KEY:-}
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__UserName: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__FromName: ${SMTP_FROM_NAME:-CouchClash}
      Email__UseSsl: "${SMTP_USE_SSL:-true}"
      AiAssistant__ApiKey: ${OPENAI_API_KEY}
      AiAssistant__Model: ${AI_MODEL:-gpt-5.6}
      Mystery__ApiKey: ${OPENAI_API_KEY}
      Mystery__Model: ${AI_MODEL:-gpt-5.6}
      Mystery__FallbackOnGenerationError: "false"
      DataProtection__KeysPath: /app/data-protection-keys
      PartyMedia__RootPath: /app/party-media
      CounterStrike__StorageRoot: /app/counter-strike
      CounterStrike__AnalyzerExecutable: /usr/local/bin/csda
      CounterStrike__MaximumDemoMegabytes: ${CS2_MAXIMUM_DEMO_MEGABYTES:-512}
      CounterStrike__ParserTimeoutSeconds: ${CS2_PARSER_TIMEOUT_SECONDS:-180}
      CounterStrike__QueueCapacity: ${CS2_QUEUE_CAPACITY:-32}
      Spotify__ClientId: ${SPOTIFY_CLIENT_ID:-}
      Spotify__ClientSecret: ${SPOTIFY_CLIENT_SECRET:-}
      Spotify__RedirectUri: https://${APP_DOMAIN}/api/parties/spotify/callback
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--header",
          "Host: ${APP_DOMAIN}",
          "http://127.0.0.1:8080/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - "8080"
    volumes:
      - backend-logs:/app/logs
      - backend-data-protection:/app/data-protection-keys
      - party-media:/app/party-media
      - counter-strike-data:/app/counter-strike
    networks:
      - internal

  frontend:
    image: ${FRONTEND_IMAGE:-community-intranet-frontend:local}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "80"
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  backend-logs:
  backend-data-protection:
  party-media:
  counter-strike-data:
  caddy-data:
  caddy-config:
