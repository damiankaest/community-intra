name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-images:
    name: Build production ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/CommunityIntranet.Api/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
          - name: save-parser
            dockerfile: save-parser/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: community-intranet-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: community_intranet
          POSTGRES_USER: community_intranet
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U community_intranet -d community_intranet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgreSql: Host=127.0.0.1;Port=5432;Database=community_intranet;Username=community_intranet;Password=ci-only-password
      Cors__AllowedOrigins__0: http://127.0.0.1:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ephemeral JWT signing key
        shell: bash
        run: echo "Jwt__SigningKey=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            save-parser/package-lock.json

      - name: Validate Docker Compose
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose \
            --env-file deploy/.env.production.example \
            -f deploy/docker-compose.production.yml \
            config --quiet

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem dev -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref] $tokens,
                  [ref] $errors
              ) | Out-Null

              if ($errors.Count -gt 0) {
                  $failed = $true
                  $errors | ForEach-Object {
                      Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)"
                  }
              }
          }

          if ($failed) {
              exit 1
          }

      - name: Restore backend
        run: dotnet restore CommunityIntranet.sln

      - name: Build backend
        run: dotnet build CommunityIntranet.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test CommunityIntranet.sln --configuration Release --no-build

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install save parser
        working-directory: save-parser
        run: npm ci

      - name: Test save parser
        working-directory: save-parser
        run: npm test

      - name: Check save parser formatting
        working-directory: save-parser
        run: npm run format:check

      - name: Smoke-test running applications
        shell: bash
        run: |
          set -euo pipefail

          dotnet run \
            --project backend/CommunityIntranet.Api/CommunityIntranet.Api.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            --urls http://127.0.0.1:5080 \
            > /tmp/community-intranet-backend.log 2>&1 &
          backend_pid=$!

          PORT=5091 npm --prefix save-parser start \
            > /tmp/community-intranet-save-parser.log 2>&1 &
          save_parser_pid=$!

          npm --prefix frontend run dev -- --host 127.0.0.1 \
            > /tmp/community-intranet-frontend.log 2>&1 &
          frontend_pid=$!

          cleanup() {
            kill "$frontend_pid" "$save_parser_pid" "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:5080/api/system/info > /tmp/system-info.json; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:5080/api/health > /tmp/health.json
          curl --fail --silent http://127.0.0.1:5091/health > /tmp/save-parser-health.json
          curl --fail --silent http://127.0.0.1:5080/swagger/index.html > /dev/null

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --cookie-jar /tmp/user-a.cookies \
            --data '{"email":"owner-a@example.test","password":"SecurePassword123","displayName":"Owner A"}' \
            http://127.0.0.1:5080/api/auth/register \
            > /tmp/register-a.json
          user_a_token=$(jq --raw-output ".accessToken" /tmp/register-a.json)
          test -n "$user_a_token"
          test "$user_a_token" != "null"

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            http://127.0.0.1:5080/api/theme-packs \
            > /tmp/theme-packs.json
          test "$(jq length /tmp/theme-packs.json)" -ge 2
          jq --exit-status \
            '.[] | select(.key == "satisfactory-ficsit")' \
            /tmp/theme-packs.json \
            > /dev/null

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_a_token" \
            --data '{"name":"CI Organization","description":"Tenant isolation smoke test","language":"de","timeZone":"Europe/Berlin","visibleTitle":"Chief CI Officer","themePackKey":"satisfactory-ficsit","enabledModules":["projects","tasks","incidents","awards","activity-feed"]}' \
            http://127.0.0.1:5080/api/organizations \
            > /tmp/organization.json
          organization_id=$(jq --raw-output ".id" /tmp/organization.json)
          test -n "$organization_id"
          test "$organization_id" != "null"
          test "$(jq --raw-output ".themePackKey" /tmp/organization.json)" = "satisfactory-ficsit"
          test "$(jq ".enabledModules | length" /tmp/organization.json)" = "5"

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/live-operations/server/status" \
            > /tmp/live-server-status.json
          test "$(jq --raw-output ".state" /tmp/live-server-status.json)" = "NotConfigured"

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/time-clock" \
            > /tmp/time-clock-empty.json
          test "$(jq ".activeShift" /tmp/time-clock-empty.json)" = "null"
          test "$(jq ".todaySeconds" /tmp/time-clock-empty.json)" = "0"

          curl --fail --silent \
            --request POST \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/time-clock/clock-in" \
            > /tmp/time-clock-in.json
          time_shift_id=$(jq --raw-output ".shift.id" /tmp/time-clock-in.json)
          test -n "$time_shift_id"
          test "$(jq --raw-output ".alreadyActive" /tmp/time-clock-in.json)" = "false"

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_a_token" \
            --data '{"kind":"Built","note":"CI-Fabrikteil aufgebaut"}' \
            "http://127.0.0.1:5080/api/organizations/$organization_id/time-clock/entries" \
            > /tmp/time-clock-entry.json
          test "$(jq --raw-output ".kind" /tmp/time-clock-entry.json)" = "Built"
          test "$(jq --raw-output ".note" /tmp/time-clock-entry.json)" = "CI-Fabrikteil aufgebaut"

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/time-clock" \
            > /tmp/time-clock-active.json
          test "$(jq --raw-output ".activeShift.id" /tmp/time-clock-active.json)" = "$time_shift_id"
          test "$(jq ".activeMembers | length" /tmp/time-clock-active.json)" = "1"
          test "$(jq ".recentEntries | length" /tmp/time-clock-active.json)" = "1"

          sleep 1
          curl --fail --silent \
            --request POST \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/time-clock/clock-out" \
            > /tmp/time-clock-out.json
          test "$(jq --raw-output ".id" /tmp/time-clock-out.json)" = "$time_shift_id"
          test "$(jq ".elapsedSeconds" /tmp/time-clock-out.json)" -ge 1

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/time-clock" \
            > /tmp/time-clock-finished.json
          test "$(jq ".activeShift" /tmp/time-clock-finished.json)" = "null"
          test "$(jq ".todaySeconds" /tmp/time-clock-finished.json)" -ge 1
          test "$(jq ".weekSeconds" /tmp/time-clock-finished.json)" -ge 1

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/factory-insights" \
            > /tmp/factory-insights-empty.json
          test "$(jq ".factories | length" /tmp/factory-insights-empty.json)" = "0"
          test "$(jq ".recentSnapshots | length" /tmp/factory-insights-empty.json)" = "0"
          test "$(jq --raw-output ".saveParserAvailable" /tmp/factory-insights-empty.json)" = "true"

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_a_token" \
            --data '{"name":"CI Aluminiumwerk","description":"Automatischer Fabrik-Smoke-Test"}' \
            "http://127.0.0.1:5080/api/organizations/$organization_id/factory-insights/factories" \
            > /tmp/factory-created.json
          factory_id=$(jq --raw-output ".id" /tmp/factory-created.json)
          test -n "$factory_id"

          curl --fail --silent \
            --request POST \
            --cookie /tmp/user-a.cookies \
            --cookie-jar /tmp/user-a-rotated.cookies \
            http://127.0.0.1:5080/api/auth/refresh \
            > /tmp/refresh-a.json
          rotated_token=$(jq --raw-output ".accessToken" /tmp/refresh-a.json)
          test -n "$rotated_token"
          test "$rotated_token" != "null"

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"email":"member-b@example.test","password":"SecurePassword123","displayName":"Member B"}' \
            http://127.0.0.1:5080/api/auth/register \
            > /tmp/register-b.json
          user_b_token=$(jq --raw-output ".accessToken" /tmp/register-b.json)

          time_clock_tenant_status=$(curl --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $user_b_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/time-clock")
          test "$time_clock_tenant_status" = "404"

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/assistant/availability" \
            > /tmp/assistant-availability.json
          test "$(jq --raw-output ".isConfigured" /tmp/assistant-availability.json)" = "false"

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/assistant/chat" \
            > /tmp/assistant-chat.json
          test "$(jq ".messages | length" /tmp/assistant-chat.json)" = "0"
          test "$(jq --raw-output ".title" /tmp/assistant-chat.json)" = "Neuer Chat"

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_a_token" \
            --data '{"tone":"Theme"}' \
            "http://127.0.0.1:5080/api/organizations/$organization_id/assistant/conversations" \
            > /tmp/assistant-conversation.json
          assistant_conversation_id=$(jq --raw-output ".id" /tmp/assistant-conversation.json)
          test -n "$assistant_conversation_id"
          test "$assistant_conversation_id" != "null"
          test "$(jq --raw-output ".title" /tmp/assistant-conversation.json)" = "Neuer Chat"

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/assistant/conversations" \
            > /tmp/assistant-conversations.json
          test "$(jq "length" /tmp/assistant-conversations.json)" = "1"

          curl --fail --silent \
            --request PATCH \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_a_token" \
            --data '{"title":"Aluminium-Ausbau"}' \
            "http://127.0.0.1:5080/api/organizations/$organization_id/assistant/conversations/$assistant_conversation_id" \
            > /tmp/assistant-conversation-renamed.json
          test "$(jq --raw-output ".title" /tmp/assistant-conversation-renamed.json)" = "Aluminium-Ausbau"

          curl --fail --silent \
            --request DELETE \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/assistant/conversations/$assistant_conversation_id"

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/assistant/conversations" \
            > /tmp/assistant-conversations-empty.json
          test "$(jq "length" /tmp/assistant-conversations-empty.json)" = "0"

          assistant_tenant_status=$(curl --silent \
            --output /tmp/assistant-tenant-isolation.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $user_b_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/assistant/availability")
          test "$assistant_tenant_status" = "404"

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_a_token" \
            --data '{"defaultPermissionRole":"Member","expiresInDays":7,"maximumUses":1}' \
            "http://127.0.0.1:5080/api/organizations/$organization_id/invitations" \
            > /tmp/invitation.json
          invitation_token=$(jq --raw-output ".token" /tmp/invitation.json)
          test -n "$invitation_token"
          test "$invitation_token" != "null"

          jq --null-input \
            --arg token "$invitation_token" \
            '{token: $token}' \
            > /tmp/invitation-request.json
          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --data @/tmp/invitation-request.json \
            http://127.0.0.1:5080/api/invitations/resolve \
            > /tmp/invitation-preview.json
          test "$(jq --raw-output ".organizationId" /tmp/invitation-preview.json)" = "$organization_id"

          tenant_status=$(curl --silent \
            --output /tmp/tenant-isolation.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $user_b_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id")
          test "$tenant_status" = "404"

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_b_token" \
            --data @/tmp/invitation-request.json \
            http://127.0.0.1:5080/api/invitations/accept \
            > /tmp/invitation-accepted.json
          test "$(jq --raw-output ".organizationId" /tmp/invitation-accepted.json)" = "$organization_id"

          curl --fail --silent \
            --header "Authorization: Bearer $user_b_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id" \
            > /tmp/member-organization.json
          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/members" \
            > /tmp/members.json
          test "$(jq length /tmp/members.json)" = "2"
          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/departments" \
            > /tmp/departments.json
          test "$(jq length /tmp/departments.json)" -ge 1

          member_b_id=$(jq --raw-output ".membershipId" /tmp/invitation-accepted.json)
          member_a_id=$(jq --raw-output \
            '.[] | select(.email == "owner-a@example.test") | .id' \
            /tmp/members.json)
          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_a_token" \
            --data "{\"name\":\"Phase 6 Factory\",\"description\":\"CI project\",\"status\":\"InProgress\",\"priority\":\"High\",\"ownerMemberId\":\"$member_b_id\",\"startDate\":\"2026-07-28\",\"dueDate\":\"2026-08-28\"}" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/projects" \
            > /tmp/project.json
          project_id=$(jq --raw-output ".id" /tmp/project.json)
          test -n "$project_id"

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_b_token" \
            --data "{\"title\":\"Connect conveyor\",\"description\":\"Tenant-aware task\",\"status\":\"Open\",\"priority\":\"Normal\",\"projectId\":\"$project_id\",\"assignedMemberId\":\"$member_b_id\",\"dueDate\":\"2026-08-01\",\"materials\":[{\"name\":\"Conveyor Belt Mk.1\",\"quantity\":\"2\",\"notes\":\"Bring to the build site\"}]}" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/tasks" \
            > /tmp/task.json
          test "$(jq --raw-output ".projectId" /tmp/task.json)" = "$project_id"
          task_id=$(jq --raw-output ".id" /tmp/task.json)

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_b_token" \
            --data "{\"title\":\"Check belt direction\",\"description\":\"Confirm that items reach the target container.\",\"status\":\"Open\",\"priority\":\"Normal\",\"projectId\":\"$project_id\",\"parentTaskId\":\"$task_id\",\"assignedMemberId\":\"$member_b_id\"}" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/tasks" \
            > /tmp/subtask.json
          test "$(jq --raw-output ".parentTaskId" /tmp/subtask.json)" = "$task_id"

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_b_token" \
            --data "{\"body\":\"Belt is connected; screenshot follows.\",\"mentionedMemberIds\":[\"$member_a_id\"]}" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/tasks/$task_id/comments" \
            > /tmp/task-comment.json

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' \
            | base64 --decode > /tmp/task-screenshot.png
          curl --fail --silent \
            --request POST \
            --header "Authorization: Bearer $user_b_token" \
            --form "file=@/tmp/task-screenshot.png;type=image/png" \
            --form "thumbnail=@/tmp/task-screenshot.png;type=image/png" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/tasks/$task_id/attachments" \
            > /tmp/task-attachment.json

          curl --fail --silent \
            --header "Authorization: Bearer $user_b_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/tasks/$task_id/details" \
            > /tmp/task-details.json
          test "$(jq ".subtasks | length" /tmp/task-details.json)" = "1"
          test "$(jq ".comments | length" /tmp/task-details.json)" = "1"
          test "$(jq ".attachments | length" /tmp/task-details.json)" = "1"
          test "$(jq ".materials | length" /tmp/task-details.json)" = "1"
          test "$(jq --raw-output ".materials[0].isPrepared" /tmp/task-details.json)" = "false"
          test "$(jq --raw-output ".attachments[0].thumbnailUrl" /tmp/task-details.json)" != "null"
          material_id=$(jq --raw-output ".materials[0].id" /tmp/task-details.json)
          material_token=$(jq --raw-output ".materials[0].concurrencyToken" /tmp/task-details.json)
          curl --fail --silent \
            --request PATCH \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_b_token" \
            --data "{\"isPrepared\":true,\"concurrencyToken\":\"$material_token\"}" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/tasks/$task_id/materials/$material_id" \
            > /tmp/task-material.json
          test "$(jq --raw-output ".isPrepared" /tmp/task-material.json)" = "true"

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/notifications?unreadOnly=true" \
            > /tmp/notifications.json
          test "$(jq length /tmp/notifications.json)" -ge 1
          test "$(jq --raw-output ".[0].notificationType" /tmp/notifications.json)" = "task.mentioned"
          curl --fail --silent \
            --request POST \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/notifications/read-all" \
            > /dev/null
          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/notifications/summary" \
            > /tmp/notification-summary.json
          test "$(jq ".unreadCount" /tmp/notification-summary.json)" = "0"

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_b_token" \
            --data '{"title":"Power grid unstable","description":"Fuse status disputed","category":"Stromausfall","severity":"High","status":"Reported","occurredAt":"2026-07-28T18:00:00Z"}' \
            "http://127.0.0.1:5080/api/organizations/$organization_id/incidents" \
            > /tmp/incident.json
          test "$(jq --raw-output ".status" /tmp/incident.json)" = "Reported"

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $user_a_token" \
            --data "{\"name\":\"CI Officer\",\"description\":\"For keeping the pipeline green.\",\"awardedToMemberId\":\"$member_b_id\",\"icon\":\"award\",\"category\":\"Quality\",\"isPublic\":true}" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/awards" \
            > /tmp/award.json
          test "$(jq --raw-output ".awardedToMemberId" /tmp/award.json)" = "$member_b_id"

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/dashboard" \
            > /tmp/dashboard.json
          test "$(jq ".memberCount" /tmp/dashboard.json)" = "2"
          test "$(jq ".openTaskCount" /tmp/dashboard.json)" = "2"
          test "$(jq ".activeProjectCount" /tmp/dashboard.json)" = "1"
          test "$(jq ".openIncidentCount" /tmp/dashboard.json)" = "1"
          test "$(jq --raw-output ".focusProject.name" /tmp/dashboard.json)" = "Phase 6 Factory"
          test "$(jq ".priorityTasks | length" /tmp/dashboard.json)" -ge 1
          test "$(jq ".weeklyPulse.createdTaskCount" /tmp/dashboard.json)" = "2"
          test "$(jq --raw-output ".currentAward.name" /tmp/dashboard.json)" = "CI Officer"

          curl --fail --silent \
            --header "Authorization: Bearer $user_a_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/activities" \
            > /tmp/activities.json
          test "$(jq length /tmp/activities.json)" -ge 6

          curl --fail --silent \
            --request DELETE \
            --header "Authorization: Bearer $user_b_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/tasks/$task_id"
          deleted_task_status=$(curl --silent \
            --output /tmp/deleted-task.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $user_b_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/tasks/$task_id/details")
          test "$deleted_task_status" = "404"
          curl --fail --silent \
            --header "Authorization: Bearer $user_b_token" \
            "http://127.0.0.1:5080/api/organizations/$organization_id/tasks" \
            > /tmp/tasks-after-delete.json
          test "$(jq length /tmp/tasks-after-delete.json)" = "0"

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173 > /tmp/frontend.html; then
              break
            fi
            sleep 1
          done

          grep --quiet "Community Intranet" /tmp/frontend.html
          grep --quiet '"status":"Operational"' /tmp/system-info.json
          grep --quiet '"status":"Healthy"' /tmp/health.json

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            /tmp/community-intranet-backend.log
            /tmp/community-intranet-frontend.log
          if-no-files-found: ignore
