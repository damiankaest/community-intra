name: community-intranet

services:
  postgres:
    image: postgres:17-alpine
    container_name: community-intranet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - community-intranet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  save-parser:
    build:
      context: .
      dockerfile: save-parser/Dockerfile
    container_name: community-intranet-save-parser
    restart: unless-stopped
    environment:
      PORT: 3000
      MAX_SAVE_BYTES: 209715200
    ports:
      - "127.0.0.1:${SAVE_PARSER_PORT:-5091}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  community-intranet-postgres:
